name: Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

# Cancel in-progress runs for same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed for releasing
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds (native - each runner builds for its own architecture)
          - os: macos-15-intel  # Intel x86_64 (official replacement for macos-13)
            platform: macos
            arch: x86_64

          - os: macos-14  # Apple Silicon ARM64
            platform: macos
            arch: arm64

          # Linux builds (native - each runner builds for its own architecture)
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64

          # ARM64 Linux (native build with clang++ + libc++)
          # Note: Free ARM64 runners for public repos use 'ubuntu-22.04-arm' label
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential \
            libicu-dev python3 git curl zip unzip libssl-dev clang libc++-dev libc++abi-dev patchelf

      - name: Cache Hermes build
        id: cache-hermes
        uses: actions/cache@v4
        with:
          path: vendor/hermes/build
          key: hermes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/hermes/CMakeLists.txt') }}
          restore-keys: |
            hermes-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Hermes
        run: |
          # Check if Hermes VM shared library exists
          HERMES_BUILT=false
          if [ "$RUNNER_OS" == "Linux" ]; then
            [ -f "vendor/hermes/build/API/hermes/libhermes_lean.so" ] && HERMES_BUILT=true
          else
            [ -f "vendor/hermes/build/API/hermes/libhermes_lean.dylib" ] && HERMES_BUILT=true
          fi

          if [ "$HERMES_BUILT" = false ]; then
            echo "Hermes shared libraries not found, building..."
            cd vendor/hermes
            mkdir -p build
            cd build

            if [ "$RUNNER_OS" == "Linux" ]; then
              # Linux: Use clang++ with libc++ for Zig ABI compatibility
              cmake .. \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
                -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++ -lc++abi" \
                -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -lc++ -lc++abi" \
                -DCMAKE_BUILD_TYPE=Release \
                -DHERMES_ENABLE_DEBUGGER=ON \
                -DHERMES_ENABLE_INTL=OFF \
                -DHERMES_ENABLE_TEST_SUITE=OFF \
                -DHERMES_BUILD_SHARED_JSI=ON \
                -DHERMES_BUILD_APPLE_DSYM=OFF \
                -GNinja
            else
              # macOS: Default compiler (C++ stdlib compatibility is native)
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DHERMES_ENABLE_DEBUGGER=ON \
                -DHERMES_ENABLE_INTL=OFF \
                -DHERMES_ENABLE_TEST_SUITE=OFF \
                -DHERMES_BUILD_SHARED_JSI=ON \
                -DHERMES_BUILD_APPLE_DSYM=OFF \
                -GNinja
            fi

            # Build required targets
            # - hermesvmlean: Hermes VM runtime as shared library (libhermes_lean.dylib/.so)
            # - hermesc: Hermes bytecode compiler
            # - jsi: JSI (JavaScript Interface) shared library (libjsi.dylib/.so)
            ninja hermesvmlean hermesc jsi

            echo "✓ Hermes shared libraries built successfully"
          else
            echo "✓ Hermes shared libraries found in cache"
          fi

          # Verify shared libraries exist
          if [ "$RUNNER_OS" == "Linux" ]; then
            ls -lh vendor/hermes/build/API/hermes/libhermes_lean.so vendor/hermes/build/jsi/libjsi.so || echo "Warning: Hermes shared libraries missing"
          else
            ls -lh vendor/hermes/build/API/hermes/libhermes_lean.dylib vendor/hermes/build/jsi/libjsi.dylib || echo "Warning: Hermes shared libraries missing"
          fi

      - name: Cache libuv build
        id: cache-libuv
        uses: actions/cache@v4
        with:
          path: vendor/libuv/build
          key: libuv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/libuv/CMakeLists.txt') }}
          restore-keys: |
            libuv-${{ runner.os }}-${{ runner.arch }}-

      - name: Build libuv
        run: |
          # Check if libuv library exists
          LIBUV_BUILT=false
          if [ -f "vendor/libuv/build/libuv.a" ] || [ -f "vendor/libuv/build/libuv_a.a" ]; then
            LIBUV_BUILT=true
          fi

          if [ "$LIBUV_BUILT" = false ]; then
            echo "libuv library not found, building..."
            cd vendor/libuv
            mkdir -p build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build .
            echo "✓ libuv built successfully"
          else
            echo "✓ libuv library found in cache"
          fi

          # Verify library exists
          ls -lh vendor/libuv/build/ || echo "Warning: libuv/build directory missing"

      - name: Cache libgit2 build
        id: cache-libgit2
        uses: actions/cache@v4
        with:
          path: vendor/libgit2/build
          key: libgit2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/libgit2/CMakeLists.txt') }}
          restore-keys: |
            libgit2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build libgit2
        run: |
          # Check if libgit2 library exists
          LIBGIT2_BUILT=false
          if [ -f "vendor/libgit2/build/libgit2.a" ]; then
            LIBGIT2_BUILT=true
          fi

          if [ "$LIBGIT2_BUILT" = false ]; then
            echo "libgit2 library not found, building..."
            cd vendor/libgit2
            mkdir -p build
            cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_TESTS=OFF \
              -DBUILD_CLI=OFF \
              -DUSE_SSH=OFF \
              -DUSE_HTTPS=ON
            cmake --build . --target libgit2package
            echo "✓ libgit2 built successfully"
          else
            echo "✓ libgit2 library found in cache"
          fi

          # Verify library exists
          ls -lh vendor/libgit2/build/libgit2.a || echo "Warning: libgit2.a missing"

      - name: Cache go-enry build
        id: cache-enry
        uses: actions/cache@v4
        with:
          path: vendor/go-enry/.shared
          key: enry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/go-enry/shared/*.go') }}
          restore-keys: |
            enry-${{ runner.os }}-${{ runner.arch }}-

      - name: Build go-enry
        run: |
          # Detect platform
          if [ "$RUNNER_OS" == "Linux" ]; then
            ENRY_LIB="vendor/go-enry/.shared/linux/libenry.so"
            PLATFORM="linux"
          else
            ENRY_LIB="vendor/go-enry/.shared/darwin/libenry.dylib"
            PLATFORM="darwin"
          fi

          # Check if already built
          ENRY_BUILT=false
          [ -f "$ENRY_LIB" ] && ENRY_BUILT=true

          if [ "$ENRY_BUILT" = false ]; then
            echo "Building go-enry for $PLATFORM..."
            # Use single-arch build for CI/CD (avoids CGO cross-compilation issues)
            ENRY_SINGLE_ARCH=1 ./scripts/build-enry.sh "$PLATFORM"
            echo "✓ go-enry built successfully"
          else
            echo "✓ go-enry found in cache"
          fi

          # Verify shared library exists and check architecture
          if [ "$RUNNER_OS" == "macOS" ]; then
            ls -lh "$ENRY_LIB"
            # Verify architecture matches runner
            file "$ENRY_LIB" || echo "Warning: file check failed"
            lipo -info "$ENRY_LIB" || echo "Warning: lipo check failed"
            # Verify install name has @rpath prefix
            otool -L "$ENRY_LIB" | head -3 || echo "Warning: otool check failed"
          else
            ls -lh "$ENRY_LIB"
          fi

      - name: Cache esbuild build
        id: cache-esbuild
        uses: actions/cache@v4
        with:
          path: vendor/esbuild-wrapper/libesbuild_*
          key: esbuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/esbuild-wrapper/*.go') }}
          restore-keys: |
            esbuild-${{ runner.os }}-${{ runner.arch }}-

      - name: Build esbuild wrapper
        run: |
          # Detect expected library name
          if [ "$RUNNER_OS" == "Linux" ]; then
            if [ "${{ matrix.arch }}" == "arm64" ]; then
              ESBUILD_LIB="vendor/esbuild-wrapper/libesbuild_linux_aarch64.so"
            else
              ESBUILD_LIB="vendor/esbuild-wrapper/libesbuild_linux_x86_64.so"
            fi
          else
            if [ "${{ matrix.arch }}" == "arm64" ]; then
              ESBUILD_LIB="vendor/esbuild-wrapper/libesbuild_darwin_arm64.dylib"
            else
              ESBUILD_LIB="vendor/esbuild-wrapper/libesbuild_darwin_x86_64.dylib"
            fi
          fi

          # Check if already built
          ESBUILD_BUILT=false
          [ -f "$ESBUILD_LIB" ] && ESBUILD_BUILT=true

          if [ "$ESBUILD_BUILT" = false ]; then
            echo "Building esbuild wrapper..."
            cd vendor/esbuild-wrapper
            ./build.sh
            cd ../..
            echo "✓ esbuild wrapper built successfully"
          else
            echo "✓ esbuild wrapper found in cache"
          fi

          # Verify shared library exists
          ls -lh "$ESBUILD_LIB"

      - name: Build Vimcraft
        run: |
          # Show versions
          zig version

          # Build with optimizations (native builds on all platforms)
          # We have native runners for each architecture, so no cross-compilation needed:
          # - macos-15-intel (x86_64) builds x86_64 natively
          # - macos-14 (arm64) builds arm64 natively
          # - ubuntu-22.04 (x86_64) builds x86_64 natively
          # - ubuntu-22.04-arm (arm64) builds arm64 natively
          zig build -Doptimize=ReleaseFast

          # Replace RPATH with release-appropriate paths
          # Binary will find libraries at ../lib relative to executable
          if [ "$RUNNER_OS" == "macOS" ]; then
            # Show current RPATHs for debugging
            echo "Current RPATHs before modification:"
            otool -l zig-out/bin/vimc | grep -A2 "LC_RPATH" || echo "(none)"

            # macOS: Delete absolute build-time RPATHs
            # These are set by build.zig for local development but need to be relative for release
            # Note: Paths may differ on CI vs local, so use || true
            install_name_tool -delete_rpath "$(pwd)/vendor/hermes/build/API/hermes" zig-out/bin/vimc 2>/dev/null || true
            install_name_tool -delete_rpath "$(pwd)/vendor/hermes/build/jsi" zig-out/bin/vimc 2>/dev/null || true
            install_name_tool -delete_rpath "$(pwd)/vendor/go-enry/.shared/darwin" zig-out/bin/vimc 2>/dev/null || true
            # Note: No vendor/esbuild-wrapper rpath exists - build.zig uses @executable_path directly (line 443)

            # Add @executable_path/../lib for hermes/jsi/enry in lib/ directory
            install_name_tool -add_rpath "@executable_path/../lib" zig-out/bin/vimc
            # Note: @executable_path for esbuild is already added by Zig build (build.zig:443)
          else
            # Linux: Set RPATH for both lib/ and bin/ (esbuild is next to binary)
            patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN' zig-out/bin/vimc
          fi

          # Verify RPATH is set correctly
          if [ "$RUNNER_OS" == "macOS" ]; then
            echo "macOS RPATH:"
            if ! otool -l zig-out/bin/vimc | grep -q "LC_RPATH"; then
              echo "ERROR: No RPATH found in macOS binary"
              exit 1
            fi
            otool -l zig-out/bin/vimc | grep -A2 "LC_RPATH"
          else
            echo "Linux RPATH/RUNPATH:"
            if ! readelf -d zig-out/bin/vimc | grep -qE "(RPATH|RUNPATH)"; then
              echo "ERROR: No RPATH/RUNPATH found in Linux binary"
              exit 1
            fi
            readelf -d zig-out/bin/vimc | grep -E "(RPATH|RUNPATH)"
          fi

          # Test binary (basic smoke test)
          ./zig-out/bin/vimc --version || echo "Warning: version check failed"

      - name: Package binary
        id: package
        run: |
          # Get version from release tag or git ref
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            # Manual workflow_dispatch: use branch/tag name or short SHA
            VERSION="${GITHUB_REF_NAME:-dev-$(git rev-parse --short HEAD)}"
          fi

          echo "Building package for version: $VERSION"

          # Create package directory with proper structure (bin/ and lib/)
          mkdir -p vimcraft-package/bin
          mkdir -p vimcraft-package/lib

          # Copy binary to bin/
          cp zig-out/bin/vimc vimcraft-package/bin/

          # Bundle shared libraries (hermes/enry to lib/, esbuild to bin/)
          if [ "$RUNNER_OS" == "Linux" ]; then
            cp vendor/hermes/build/API/hermes/libhermes_lean.so vimcraft-package/lib/
            cp vendor/hermes/build/jsi/libjsi.so vimcraft-package/lib/
            cp vendor/go-enry/.shared/linux/libenry.so vimcraft-package/lib/
            # esbuild library goes to bin/ (next to executable, uses $ORIGIN)
            if [ "${{ matrix.arch }}" == "arm64" ]; then
              cp vendor/esbuild-wrapper/libesbuild_linux_aarch64.so vimcraft-package/bin/
            else
              cp vendor/esbuild-wrapper/libesbuild_linux_x86_64.so vimcraft-package/bin/
            fi
          else
            # macOS: Copy .dylib files
            cp vendor/hermes/build/API/hermes/libhermes_lean.dylib vimcraft-package/lib/ || echo "Warning: libhermes_lean.dylib not found"
            cp vendor/hermes/build/jsi/libjsi.dylib vimcraft-package/lib/ || echo "Warning: libjsi.dylib not found"
            cp vendor/go-enry/.shared/darwin/libenry.dylib vimcraft-package/lib/ || echo "Warning: libenry.dylib not found"
            # esbuild library goes to bin/ (next to executable, uses @executable_path)
            if [ "${{ matrix.arch }}" == "arm64" ]; then
              cp vendor/esbuild-wrapper/libesbuild_darwin_arm64.dylib vimcraft-package/bin/ || echo "Warning: libesbuild_darwin_arm64.dylib not found"
            else
              cp vendor/esbuild-wrapper/libesbuild_darwin_x86_64.dylib vimcraft-package/bin/ || echo "Warning: libesbuild_darwin_x86_64.dylib not found"
            fi
          fi

          # Create tarball (with bin/ and lib/ directories)
          FILENAME="vimcraft-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$FILENAME" -C vimcraft-package .

          # Generate checksums
          if command -v shasum >/dev/null; then
            shasum -a 256 "$FILENAME" > "${FILENAME}.sha256"
          else
            sha256sum "$FILENAME" > "${FILENAME}.sha256"
          fi

          # Output for next step
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "checksum_file=${FILENAME}.sha256" >> $GITHUB_OUTPUT

          # Show results
          ls -lh "$FILENAME"
          cat "${FILENAME}.sha256"

          # Verify tarball structure
          echo ""
          echo "Tarball contents:"
          tar -tzf "$FILENAME" | head -20

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.package.outputs.filename }}
            ${{ steps.package.outputs.checksum_file }}

      - name: Upload Artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vimcraft-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.filename }}
            ${{ steps.package.outputs.checksum_file }}
          retention-days: 7

  # Generate checksums file combining all platforms
  checksums:
    name: Generate Combined Checksums
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*.sha256"
          out-file-path: "checksums"

      - name: Combine Checksums
        run: |
          cd checksums
          cat *.sha256 > ../checksums.txt
          cd ..

          echo "=== Combined Checksums ==="
          cat checksums.txt

      - name: Upload Combined Checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: checksums.txt

  # Verify the release is complete
  verify-release:
    name: Verify Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Check Release Assets
        run: |
          echo "Checking release: ${{ github.event.release.tag_name }}"

          # Expected files
          EXPECTED=(
            "vimcraft-${{ github.event.release.tag_name }}-macos-x86_64.tar.gz"
            "vimcraft-${{ github.event.release.tag_name }}-macos-arm64.tar.gz"
            "vimcraft-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz"
            "vimcraft-${{ github.event.release.tag_name }}-linux-arm64.tar.gz"
            "checksums.txt"
          )

          echo "Expected files:"
          printf '%s\n' "${EXPECTED[@]}"

          echo "✓ Release verification complete"

      - name: Update Release Description
        uses: actions/github-script@v7
        with:
          script: |
            // Get current release
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
            });

            // Append build status to release body
            const buildStatus = [
              '',
              '',
              '---',
              '',
              '## 🎉 Release binaries built successfully!',
              '',
              'Binaries are now available for:',
              '- macOS (Intel x86_64 & Apple Silicon ARM64)',
              '- Linux (x86_64 & ARM64)',
              '',
              '**Quick Install:**',
              '```bash',
              'curl -fsSL https://vimcraft.com/install.sh | sh',
              '```',
              '',
              '**Verify checksums:**',
              '```bash',
              'shasum -a 256 -c checksums.txt',
              '```'
            ].join('\n');

            // Update release with appended body
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: (release.data.body || '') + buildStatus
            });

